{# Shared shapes, so the statistics page's four bar lists cannot drift apart. #}
{% macro bar_row(row, color) %}<div class="bar-row">
        <div class="bar-row-label" title="{{ row.label }}">{{ row.label }}</div>
        <div class="bar-row-track"><div class="bar-row-fill" style="width:{{ row.width }}%;background:{{ color }}"></div></div>
        <div class="bar-row-count" title="{{ row.count_title }}"><div>{{ row.count }}</div>{% if row.share != "" %}<div class="bar-row-pct">{{ row.share }}</div>{% endif %}</div>
      </div>{% endmacro %}
