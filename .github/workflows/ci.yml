name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref at a time. A newer push supersedes the run it interrupted;
# a tag does not — a tagged build publishes one specific version and nothing
# should quietly cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0


      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-deny@0.18.9
      - name: cargo deny check
        run: cargo deny check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0


      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-nextest

      - name: Run tests
        run: cargo nextest run

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # cargo-llvm-cov installs the llvm-tools-preview component itself, so the
      # toolchain needs no extra declaration beyond rust-toolchain.toml.

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-nextest

      - name: Generate coverage
        run: cargo llvm-cov nextest --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: henry40408/noadd
          files: lcov.info
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0


      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # `e2e` is its own workspace, deliberately outside the one at the
          # repository root, so it has to be named or none of its dependencies
          # are cached.
          workspaces: |
            .
            e2e

      # The suites start this binary themselves; building it here keeps the
      # compile off their own timeouts, and the admin UI is embedded at compile
      # time, so a stale binary would be testing yesterday's markup.
      - name: Build noadd (embeds the admin UI)
        run: cargo build

      # `e2e` is linted here rather than in `check`, so it shares the build this
      # job already pays for. It is deliberately outside `cargo deny`: the
      # browser stack pulls in licences the server's allow-list does not carry,
      # and none of it is distributed — the Docker image contains the server
      # alone.
      - name: Check formatting (e2e)
        working-directory: e2e
        run: cargo fmt --check

      - name: Clippy (e2e)
        working-directory: e2e
        run: cargo clippy --all-targets -- -D warnings

      # No browser install step: `WebDriver::managed` downloads a matching
      # chromedriver on demand, and the runner image already ships Chrome.
      - name: Run the Cucumber features
        working-directory: e2e
        run: cargo test --test e2e

      - name: Run the specs
        working-directory: e2e
        run: cargo test --test specs
