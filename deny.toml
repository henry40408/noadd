# cargo-deny supply-chain checks: `cargo deny check`, also run in CI.

[graph]
# Include every feature's dependencies, so an optional one can't smuggle in a
# bad license or advisory.
all-features = true

[advisories]
version = 2
# `ignore`: advisory IDs reviewed and accepted.
yanked = "deny"
ignore = [
    # basic-toml is unmaintained; build-time only, via askama_derive 0.16.1
    # (latest), which still depends on it. Remove once askama drops it.
    # Tracked in #324.
    "RUSTSEC-2026-0374",
    # ctutils 0.4.2 (transitive, via argon2/blake2/digest and phc) is fixed in
    # 0.4.4, published 2026-10-23 01:04 UTC; the 168-hour dependency cooldown
    # ends 2026-10-30 01:04 UTC. Upgrade to 0.4.4 and remove then.
    # Tracked in #339.
    "RUSTSEC-2026-0385",
]

[licenses]
version = 2
# Permissive licenses only; add one only after reviewing the crate.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io; any other registry or git source is rejected.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
