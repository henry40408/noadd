# cargo-deny supply-chain checks: `cargo deny check`, also run in CI.

[graph]
# Include every feature's dependencies, so an optional one can't smuggle in a
# bad license or advisory.
all-features = true

[advisories]
version = 2
# `ignore`: advisory IDs reviewed and accepted.
yanked = "deny"
ignore = [
    # rustls 0.23.45: fixed in 0.23.46 (published 2026-10-14 09:54 UTC), still
    # inside the 168-hour dependency cooldown. Upgrade after 2026-10-21 09:54
    # UTC and remove these four entries.
    # Reachability: no ECH usage in src/ (0347); no `brotli` crate in
    # Cargo.lock, so Brotli cert decompression is not compiled in (0348);
    # session Debug exposure (0346) and key-exchange downgrade (0349) are
    # not assessed.
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0347",
    "RUSTSEC-2026-0348",
    "RUSTSEC-2026-0349",
    # webpki-roots 0.26.11 is a shim that depends on webpki-roots 1.0.10, which
    # already removes the emSign root, so the root is absent at runtime. No
    # 0.26.x fix exists; async-web-client 0.6.3 (via rustls-acme 0.15.4) pins
    # ^0.26. Remove after they move to 1.x. Tracked in #323.
    "RUSTSEC-2026-0381",
    # basic-toml is unmaintained; build-time only, via askama_derive 0.16.1
    # (latest), which still depends on it. Remove once askama drops it.
    # Tracked in #324.
    "RUSTSEC-2026-0374",
]

[licenses]
version = 2
# Permissive licenses only; add one only after reviewing the crate.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io; any other registry or git source is rejected.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
