[package]
name = "noadd-e2e"
version = "0.0.0"
edition = "2024"
publish = false
description = "Browser E2E tests and the screenshot pipeline for the noadd admin UI"

# Deliberately its own workspace, not a member of the one at the repository
# root. CI runs coverage as `cargo llvm-cov nextest --workspace`, which would
# otherwise compile thirtyfour and drive a real browser on every coverage run.
# `e2e/` was already a self-contained sub-project when it was JavaScript; this
# keeps that boundary.
[workspace]

[dependencies]
anyhow = "1.0.102"
base64 = "0.23.0"
cucumber = "0.23.0"
reqwest = { version = "0.13.0", default-features = false, features = ["rustls", "json"] }
serde_json = "1.0.145"
# Pinned exactly: 0.37.5 was published 2026-08-12, inside the seven-day cooldown
# this project applies to fresh releases. Relax to a caret once it has aged out.
thirtyfour = "=0.37.4"
tokio = { version = "1.52.3", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }

# The Cucumber runner and the spec runner both drive their own scenarios, so
# neither wants libtest collecting `#[test]` functions.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = false

[[test]]
name = "specs"
path = "tests/specs/main.rs"
harness = false

# Mirrors the root crate's lint set, minus the entries that only apply to the
# server. Being a separate workspace means none of it is inherited, and test
# code that lints differently from the code it tests drifts.
[lints.rust]
unexpected_cfgs = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Opt out of the noisy / low-signal pedantic lints.
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
duration_suboptimal_units = "allow"
items_after_statements = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"

# Restriction lints (no safe umbrella group — kept itemised).
dbg_macro = "warn"
exit = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
rest_pat_in_fully_bound_structs = "warn"
string_add = "warn"
todo = "warn"
unimplemented = "warn"
verbose_file_reads = "warn"

# Nursery picks (the nursery group as a whole is too unstable to enable).
debug_assert_with_mut_call = "warn"
fallible_impl_from = "warn"
trait_duplication_in_bounds = "warn"
